<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}İZ{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
</head>
<body>
    <div class="shell">
        <nav class="nav">
            <a class="logo" href="{{ url_for('index') }}">İZ</a>
            <div class="nav-links">
                <a href="{{ url_for('index') }}">Defter</a>
                <a href="{{ url_for('new_entry') }}">Yeni</a>
                <a href="{{ url_for('stats') }}">İstatistik</a>
                <a href="{{ url_for('about') }}">Hakkında</a>
            </div>
        </nav>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}

        <main class="main">
            {% block main %}{% endblock %}
        </main>

        <footer class="footer">
            <p>İZ · CS50 Final Project · Resul Kılınç</p>
        </footer>
    </div>
</body>
</html>
